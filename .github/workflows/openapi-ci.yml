name: OpenAPI Drift y Spectral

on:
  pull_request:
  push:

jobs:
  verificar-openapi:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar OpenAPI contra codigo
        run: python scripts/export_openapi.py --check

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analizar OpenAPI con Spectral
        run: npx --yes @stoplight/spectral-cli@6 lint openapi.json --ruleset .spectral.yaml
